# Public-only collection. Disable this workflow or set config/collection-policy.json
# "enabled": false to stop. Per-source intervals in committed state decide what is due;
# the cron only provides ticks.
name: Collect public orbital data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect.yml'
      - 'config/**'
      - 'scripts/**'
      - 'vendor/**'
      - 'tests/**'
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  group: orbital-public-collection
  cancel-in-progress: false

jobs:
  collect:
    # Evaluated before a runner is allocated: a wrong, private or forked repository,
    # or any branch other than the default branch, never runs.
    if: >-
      toJSON(github.event.repository.private) == 'false' &&
      github.event.repository.visibility == 'public' &&
      github.repository == 'brand-on-fire/orbital-policy-simulator-data' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check runtime (Node 22 or later, no install step)
        run: node scripts/check-runtime.mjs

      - name: Verify vendored SGP4 (satellite.js 7.1.0 checksum and golden propagation)
        run: node scripts/verify-vendor.mjs

      - name: Offline tests
        run: node --test tests/*.test.mjs

      - name: Restore last publication and collector state
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish.mjs restore

      - name: Collect due sources (stops CelesTrak on the first non-200)
        id: collect
        continue-on-error: true
        run: node scripts/collect.mjs

      - name: Keepalive heartbeat (at most once per 30 days)
        id: keepalive
        if: always() && steps.restore.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish.mjs keepalive

      - name: Validate and publish (always publishes the diagnostic status)
        if: always() && steps.restore.outcome == 'success' && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish.mjs publish

      - name: Surface collection failure for a human
        if: always() && (steps.collect.outcome == 'failure' || steps.keepalive.outcome == 'failure')
        run: |
          echo "Collection needs a human: see status.json on the public-data branch and this run's summary."
          exit 1

# No cache, upload-artifact, package registry, Pages deployment, larger runner,
# secrets, Cloudflare binding or paid API. The only credential is the run's own
# GITHUB_TOKEN, passed to git through GIT_CONFIG_* environment variables.
